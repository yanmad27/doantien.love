<!doctype html>
<!-- Nguồn để render assets/og-image.png (1200×630). Xem tools/README.md. -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:wght@400;500&family=Dancing+Script:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #fffaf3; font-family: "Be Vietnam Pro", sans-serif; color: #59473f;
    display: grid; place-items: center; text-align: center;
  }
  .frame { position: absolute; inset: 26px; border: 1px solid rgba(239,153,144,.55); border-radius: 10px; }
  .frame::after { content: ""; position: absolute; inset: 9px; border: 1px solid rgba(170,131,86,.28); border-radius: 5px; }
  .fl { position: absolute; pointer-events: none; }
  .fl-a { width: 460px; top: -70px; left: -110px; transform: rotate(8deg); }
  .fl-b { width: 330px; bottom: -90px; right: -70px; transform: rotate(-14deg); }
  .inner { position: relative; z-index: 2; }
  .mono { width: 132px; height: auto; display: block; margin: 0 auto; }
  .kicker { margin-top: 20px; color: #7d5b2c; font-size: 15px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; }
  h1 { margin-top: 6px; font-family: "Great Vibes", "Dancing Script", cursive; font-size: 104px; line-height: 1.12; color: #bf504b; }
  h1 small { display: block; font-family: "Cormorant Garamond", serif; font-size: .34em; color: #aa8356; margin: 2px 0; }
  /* lining-nums: Cormorant Garamond mặc định là số old-style, "04 · 10 · 2026" sẽ so le cao thấp */
  .date { margin-top: 26px; font-family: "Cormorant Garamond", serif; font-size: 27px; font-weight: 500; letter-spacing: .3em; font-variant-numeric: lining-nums; }
  .venue { margin-top: 10px; color: #6f5d55; font-size: 16px; letter-spacing: .16em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="frame"></div>
  <img class="fl fl-a" src="../assets/floral-cluster.webp" alt="">
  <img class="fl fl-b" src="../assets/floral-branch.webp" alt="">
  <div class="inner">
    <img class="mono" src="../assets/heart-logo.webp" alt="">
    <p class="kicker">Thiệp mời cưới</p>
    <h1>Khắc Doãn <small>&amp;</small> Đông Tiên</h1>
    <p class="date">04 · 10 · 2026</p>
    <p class="venue">Nhà hàng Long Phụng — Khánh Hòa</p>
  </div>
</body>
</html>
