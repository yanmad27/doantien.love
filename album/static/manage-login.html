<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fffaf3">
<title>Trang chủ nhà · Album cưới Khắc Doãn &amp; Đông Tiên</title>
<!--__CDN_PRECONNECT__-->
<link rel="icon" href="/static/img/favicon.svg?v=__V__" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts.css?v=__V__">
<link rel="stylesheet" href="/static/album.css?v=__V__">
<link rel="stylesheet" href="/static/manage.css?v=__V__">
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<img class="flower flower--tl" src="/static/img/bloom-corner.webp?v=__V__" width="400" height="451" alt="" aria-hidden="true">

<main class="page narrow">
  <header class="intro">
    <img class="logo" src="/static/img/heart-logo.webp?v=__V__" width="320" height="236" alt="Khắc Doãn và Đông Tiên">
    <p class="eyebrow">Dành riêng cho chủ nhà</p>
    <h1 class="title">Trang chủ nhà</h1>
    <i class="ornament" aria-hidden="true"></i>
    <p class="lead">Nhập mã chủ nhà để tải ảnh cưới lên và quản lý album.</p>
    <p class="back"><a href="/">← Xem album</a></p>
  </header>

  <section class="card panel" aria-labelledby="h-login">
    <h2 class="h" id="h-login">Mã chủ nhà</h2>
    <form class="token-row" id="login-form">
      <label class="sr" for="token-in">Mã chủ nhà</label>
      <input id="token-in" type="password" autocomplete="current-password" placeholder="Nhập mã chủ nhà" required autofocus>
      <button type="submit" class="btn btn--solid" id="login-btn">Vào trang</button>
    </form>
    <p class="pmsg err" id="login-msg" role="alert" hidden></p>
    <p class="note login-note">Mã chỉ được dùng để mở trang này và không bao giờ hiện ra trên màn hình.</p>
  </section>
</main>
<script src="/static/manage-login.js?v=__V__"></script>
</body>
</html>
