<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tải ảnh &amp; Xử lý</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 900px; margin-inline: auto; color: #222; }
  h1 { font-size: 1.4rem; }
  .panel { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  progress { width: 100%; height: 18px; }
  #files { list-style: none; padding: 0; margin: 8px 0 0; max-height: 260px; overflow: auto; font-size: .85rem; }
  #files li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px solid #eee; }
  .ok { color: #070; } .err { color: #a00; } .dup { color: #a60; }
  button { padding: 8px 16px; font-size: 1rem; }
  #drop { border: 2px dashed #aaa; border-radius: 8px; padding: 18px; text-align: center; margin-bottom: 8px; }
  #drop.over { background: #eef6ff; }
  #errors { color: #a00; font-size: .85rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Tải ảnh lên &amp; Xử lý</h1>
<p><a href="/">← Tìm ảnh bằng selfie</a> · <span id="stats"></span></p>
<p id="disk"></p>

<div class="panel">
  <h2>1. Tải ảnh gốc lên</h2>
  <div id="drop">Kéo thả ảnh vào đây hoặc <input type="file" id="pick" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple></div>
  <progress id="upbar" value="0" max="1" hidden></progress>
  <div id="upsum"></div>
  <ul id="files"></ul>
</div>

<div class="panel">
  <h2>2. Xử lý (lập chỉ mục khuôn mặt)</h2>
  <button id="proc">Xử lý</button> <span id="pmsg"></span>
  <progress id="pbar" value="0" max="1" hidden></progress>
  <div id="pinfo"></div>
  <div id="errors"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : (n / 1024).toFixed(0) + " KB";
const dur = s => s >= 60 ? Math.floor(s / 60) + " phút " + Math.round(s % 60) + " giây" : s.toFixed(0) + " giây";

async function refreshStats() {
  try {
    const d = await (await fetch("api/stats")).json();
    maxMB = d.max_upload_mb;
    $("disk").textContent = `Ổ đĩa: còn trống ${(d.disk_free / 2**30).toFixed(1)} GB / ${(d.disk_total / 2**30).toFixed(1)} GB`;
    maxMB = d.max_upload_mb;
    $("stats").textContent = `${d.originals} ảnh gốc · ${d.photos} đã xử lý · ${d.pending} chờ xử lý · ${d.faces} khuôn mặt`;
  } catch (e) {}
}

// ---- tải lên: từng file một request, 3 request song song, có tiến độ byte ----
let queue = [], active = 0, total = 0, sent = 0, doneN = 0, failN = 0, dupN = 0;
let maxMB = 80;
let maxMB = 60;
function addFiles(list) {
  for (const f of list) {
    if (f.size > maxMB * 1048576) {  // báo ngay ở trình duyệt, khỏi gửi rồi mới bị đóng kết nối
      const bad = document.createElement("li"); bad.innerHTML = "<span></span><span class='err'></span>";
      bad.firstChild.textContent = f.name; bad.lastChild.textContent = `✗ quá lớn (tối đa ${maxMB} MB)`;
      $("files").prepend(bad); failN++; continue;
    }
    if (f.size > maxMB * 1048576) {  // báo ngay ở trình duyệt, khỏi gửi rồi mới bị đóng kết nối
      const bad = document.createElement("li"); bad.innerHTML = "<span></span><span class='err'></span>";
      bad.firstChild.textContent = f.name; bad.lastChild.textContent = `✗ quá lớn (tối đa ${maxMB} MB)`;
      $("files").prepend(bad); failN++; continue;
    }
    const li = document.createElement("li");
    li.innerHTML = "<span></span><span>chờ…</span>"; li.firstChild.textContent = f.name;
    $("files").prepend(li);
    queue.push({ f, li, loaded: 0 }); total += f.size;
  }
  $("upbar").hidden = false; $("upbar").max = total; pump();
}
function pump() {
  while (active < 3 && queue.length) { active++; upload(queue.shift()); }
  const done = doneN + failN + dupN;
  $("upsum").textContent = `Đã gửi ${fmt(sent)} / ${fmt(total)} — xong ${doneN}, trùng ${dupN}, lỗi ${failN}` + (active || queue.length ? "…" : ". Hoàn tất.");
  $("upbar").value = sent;
}
function upload(it) {
  const st = it.li.lastChild, x = new XMLHttpRequest();
  x.open("POST", "api/upload?name=" + encodeURIComponent(it.f.name));
  x.setRequestHeader("Content-Type", "application/octet-stream");
  x.upload.onprogress = e => { sent += e.loaded - it.loaded; it.loaded = e.loaded; st.textContent = Math.round(e.loaded / e.total * 100) + "%"; pump(); };
  const fin = () => { sent += it.f.size - it.loaded; it.loaded = it.f.size; active--; pump(); refreshStats(); };
  x.onload = () => {
    let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {}
    if (x.status === 200 && d.status === "ok") { st.textContent = "✓ " + fmt(it.f.size) + (d.renamed ? " (đổi tên: " + d.name + ")" : ""); st.className = "ok"; doneN++; }
    else if (x.status === 200) { st.textContent = "trùng với " + d.name; st.className = "dup"; dupN++; }
    else { st.textContent = "✗ " + (d.detail || ("lỗi " + x.status)); st.className = "err"; failN++; }
    fin();
  };
  x.onerror = () => { st.textContent = "✗ mất kết nối"; st.className = "err"; failN++; fin(); };
  x.send(it.f);
}
$("pick").onchange = () => { addFiles($("pick").files); $("pick").value = ""; };
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); addFiles(e.dataTransfer.files); };

// ---- xử lý nền ----
let timer = null;
function showStatus(s) {
  const run = s.state === "running";
  $("proc").disabled = run;
  $("pbar").hidden = s.state === "idle"; $("pbar").max = Math.max(s.total, 1); $("pbar").value = s.done;
  let t = { idle: "", running: "Đang xử lý…", done: "Hoàn tất ✓", error: "Có lỗi — xem bên dưới" }[s.state];
  $("pmsg").textContent = t;
  $("pinfo").textContent = s.state === "idle" ? "" :
    `${s.done}/${s.total} ảnh · ${s.faces} khuôn mặt · ${s.failed} lỗi · ${dur(s.elapsed)}` + (s.current ? ` · đang làm: ${s.current}` : "");
  $("errors").textContent = s.errors.join("\n");
  if (run && !timer) timer = setInterval(poll, 1000);
  if (!run && timer) { clearInterval(timer); timer = null; refreshStats(); }
}
async function poll() { try { showStatus(await (await fetch("api/process")).json()); } catch (e) {} }
$("proc").onclick = async () => {
  const r = await fetch("api/process", { method: "POST" });
  const d = await r.json();
  if (r.status === 409) $("pmsg").textContent = d.message;
  showStatus(d);
  if (r.status === 200 && !timer) timer = setInterval(poll, 1000);
};
refreshStats(); poll();
</script>
</body>
</html>
