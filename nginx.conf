server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  # nginx chỉ biết host/port nội bộ container. Để nó tự dựng URL tuyệt đối thì
  # mọi redirect (kể cả 301 tự thêm "/" cho thư mục) sẽ mất https sau Traefik.
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript text/html image/svg+xml application/json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Trình duyệt tự xin các đường dẫn này ở root dù HTML trỏ vào /assets/.
  # Không map thì chúng rơi vào fallback bên dưới và nhận về HTML thay vì ảnh.
  location = /favicon.ico {
    access_log off;
    try_files /assets/favicon.ico =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /favicon.svg {
    try_files /assets/favicon.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /apple-touch-icon.png {
    try_files /assets/apple-touch-icon.png =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /apple-touch-icon-precomposed.png {
    try_files /assets/apple-touch-icon.png =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # /t/* thực tế được Traefik trỏ sang app quanly (nó render thiệp riêng từ
  # danh sách khách). Khối này chỉ là lưới an toàn: nếu định tuyến hỏng thì
  # khách rơi về thiệp chung thay vì gặp 404.
  location ^~ /t/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ @no-guest;
  }

  # /t/ trần không phải thiệp của ai — không có index nên mặc định nginx trả 403
  location = /t/ {
    return 302 /;
  }

  # Mã sai → chuyển hướng về thiệp chung, KHÔNG phục vụ index.html ngay tại chỗ.
  # index.html dùng đường dẫn tương đối ./, nếu trả nó ở /t/<mã sai>/ thì trình
  # duyệt sẽ đi tìm /t/<mã sai>/styles.css — vòng lại đúng location này và nhận
  # về HTML thay vì CSS, trang mất sạch style.
  location @no-guest {
    return 302 /;
  }

  # nginx mime.types chưa map .webmanifest → mặc định sẽ là octet-stream
  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Ảnh/icon: cache 1 ngày. `=404` để file thiếu trả về lỗi thật,
  # không rơi vào fallback index.html rồi trả HTML với status 200.
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # HTML/CSS/JS chưa có content-hash trong tên file
  # → luôn revalidate bằng ETag để tránh phục vụ bản cũ sau khi deploy lại.
  location ~* \.(?:html|css|js|txt)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
