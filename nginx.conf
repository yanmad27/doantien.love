server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript text/html image/svg+xml application/json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Trình duyệt tự xin các đường dẫn này ở root dù HTML trỏ vào /assets/.
  # Không map thì chúng rơi vào fallback bên dưới và nhận về HTML thay vì ảnh.
  location = /favicon.ico {
    access_log off;
    try_files /assets/favicon.ico =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /favicon.svg {
    try_files /assets/favicon.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /apple-touch-icon.png {
    try_files /assets/apple-touch-icon.png =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /apple-touch-icon-precomposed.png {
    try_files /assets/apple-touch-icon.png =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Thiệp riêng của từng khách: /t/<mã>/ → t/<mã>/index.html.
  # ^~ để location regex bên dưới không giành mất. Mã sai thì rơi về thiệp chung
  # thay vì 404 cho đỡ hụt hẫng.
  location ^~ /t/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }

  # nginx mime.types chưa map .webmanifest → mặc định sẽ là octet-stream
  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Ảnh/icon: cache 1 ngày. `=404` để file thiếu trả về lỗi thật,
  # không rơi vào fallback index.html rồi trả HTML với status 200.
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # HTML/CSS/JS chưa có content-hash trong tên file
  # → luôn revalidate bằng ETag để tránh phục vụ bản cũ sau khi deploy lại.
  location ~* \.(?:html|css|js|txt)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
